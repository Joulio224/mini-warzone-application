
name: Publish BulletGrounds update

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create application icon
        shell: pwsh
        run: |
          python -m pip install pillow
          New-Item -ItemType Directory -Force -Path build | Out-Null
          @'
          from PIL import Image, ImageDraw, ImageFont
          size = 256
          image = Image.new('RGBA', (size, size), (8, 17, 35, 255))
          draw = ImageDraw.Draw(image)
          draw.rounded_rectangle((12, 12, 244, 244), radius=48, fill=(13, 35, 65, 255), outline=(65, 145, 230, 255), width=8)
          try:
              font = ImageFont.truetype('arialbd.ttf', 112)
          except OSError:
              font = ImageFont.load_default()
          label = 'BG'
          bounds = draw.textbbox((0, 0), label, font=font)
          x = (size - (bounds[2] - bounds[0])) / 2
          y = (size - (bounds[3] - bounds[1])) / 2 - bounds[1]
          draw.text((x, y), label, font=font, fill=(245, 248, 255, 255))
          image.save('build/icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          '@ | Set-Content -Encoding UTF8 create_icon.py
          python create_icon.py

      - name: Build installer
        run: npm run build && npx electron-builder --win nsis --publish never
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Publish installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
